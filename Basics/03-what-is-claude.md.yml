What CLAUDE.md is:
  CLAUDE.md is your project's memory. Claude reads it at the start of every session, before you type a single word, so anything in it is already known. Write "tests run with make test" once and you stop repeating it in every new conversation.

Where it lives?:
  Claude looks for memory in a few places and merges what it finds. 

Location	                  Scope
------------                ---------------------------------------------------------
CLAUDE.md                   at the repo root of This project, shared with the team via git

.claude/CLAUDE.md	          This project, if you prefer it out of the root

~/.claude/CLAUDE.md	        You, across every project on this machine

CLAUDE.local.md	            Personal instructions for this project; add it to .gitignore

#The repo-root file is the common one: it travels with the code, so everyone working in the project (and every future session) starts from the same facts.

IMP:
Easy way to remember:
- CLAUDE.md → Project instructions.
- .claude/CLAUDE.md → Same project instructions, different location.
- ~/.claude/CLAUDE.md → Your global instructions.
- CLAUDE.local.md → Your private project instructions.

What to put in CLAUDE.md:
  A good CLAUDE.md is short and high signal. Every line should be something Claude cannot guess by reading the code, or something it keeps getting wrong. If a line is not earning its place, delete it.

The content that pays off:
  Focus on the things a new teammate would ask on day one

  1. How to build, run, and test. The exact commands: make build, pnpm dev, pytest -q. This is the highest-value content in the file.
  2. Project conventions. "Use tabs, not spaces." "All API routes go under src/routes/." "Commit messages follow Conventional Commits."
  3. Gotchas. "The dev server needs DATABASE_URL set or it hangs." "Never edit generated/ by hand, it is rebuilt."
  4. Things the agent keeps getting wrong. If you correct the same mistake twice, write it down: "Do not add new dependencies without asking." 
  
Keep it short:
  Memory is read every session, so length is a cost. Aim for a page, not an essay. A tight file of ten real facts beats a hundred lines Claude has to wade through. When something stops being true, remove it.

What not to put in it:
  Skip anything the code already says
  1. Do not restate obvious code ("the add function adds two numbers").
  2. Do not paste giant essays, full API docs, or entire style guides. Link to them or summarize the one rule that actually bites.
  3. Do not add aspirational rules nobody follows. Memory should describe how the project really works today.